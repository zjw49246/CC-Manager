name: Delivery Loop CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-loop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Delivery Loop - repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Reject unresolved merge markers
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!package-lock.json'; then
            exit 1
          fi
      - name: Check whitespace errors
        run: git diff --check
      - name: Compile backend Python
        run: python -m compileall -q backend

  frontend-build:
    name: Delivery Loop - frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
